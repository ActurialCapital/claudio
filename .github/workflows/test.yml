name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev pytest -q
      - name: docs reference is up to date
        run: uv run python docs/scripts/gen_reference.py && git diff --exit-code docs/generated
